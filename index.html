<!DOCTYPE html>
<html lang="pl" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Geoportal Mobile Studio</title>
    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#6750A4">
    <meta name="description" content="Aplikacja mobilna z mapami Geoportalu, znacznikami i linijką pomiarową">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts Inter & Material Symbols -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Roboto', 'sans-serif'],
                    },
                    colors: {
                        md: {
                            primary: '#6750A4',
                            onPrimary: '#FFFFFF',
                            primaryContainer: '#EADDFF',
                            onPrimaryContainer: '#21005D',
                            secondary: '#625B71',
                            secondaryContainer: '#E8DEF8',
                            surface: '#FEF7FF',
                            surfaceVariant: '#E7E0EC',
                            onSurface: '#1D1B20',
                            onSurfaceVariant: '#49454F',
                            outline: '#79747E',
                            error: '#B3261E',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1;
        }
        ::-webkit-scrollbar-thumb {
            background: #ccc;
            border-radius: 4px;
        }
    </style>
</head>
<body class="h-full bg-md-surface text-md-onSurface font-sans flex flex-col select-none">

    <!-- Android Material Top App Bar -->
    <header class="bg-md-surfaceVariant text-md-onSurfaceVariant shadow-sm z-30 flex items-center justify-between px-4 h-16 shrink-0">
        <div class="flex items-center space-x-3">
            <button id="menu-btn" class="p-2 rounded-full hover:bg-black/5 active:bg-black/10 transition">
                <span class="material-symbols-outlined">menu</span>
            </button>
            <h1 class="text-lg font-medium tracking-tight">Geoportal Studio</h1>
        </div>
        <div class="flex items-center space-x-1">
            <button id="toggle-layers-btn" title="Zmień warstwę mapy" class="p-2 rounded-full hover:bg-black/5 active:bg-black/10 transition">
                <span class="material-symbols-outlined">layers</span>
            </button>
            <button id="toggle-ruler-btn" title="Narzędzie linijki" class="p-2 rounded-full hover:bg-black/5 active:bg-black/10 transition relative">
                <span class="material-symbols-outlined">straighten</span>
                <span id="ruler-badge" class="absolute top-1 right-1 w-2.5 h-2.5 bg-md-primary rounded-full hidden"></span>
            </button>
            <button id="locate-btn" title="Moja lokalizacja" class="p-2 rounded-full hover:bg-black/5 active:bg-black/10 transition">
                <span class="material-symbols-outlined">my_location</span>
            </button>
        </div>
    </header>

    <!-- Main Content Area (Map + Floating Controls) -->
    <main class="relative flex-1 w-full h-full">
        <!-- Leaflet Map Canvas -->
        <div id="map" class="absolute inset-0 z-10"></div>

        <!-- Layer Selector Modal / Card -->
        <div id="layer-selector-card" class="absolute top-4 right-4 bg-md-surface/95 backdrop-blur-md rounded-2xl shadow-xl z-20 p-3 hidden border border-md-surfaceVariant w-64 space-y-2">
            <div class="flex items-center justify-between px-2 pb-1 border-b border-md-surfaceVariant">
                <span class="text-xs font-bold uppercase tracking-wider text-md-onSurfaceVariant">Wybierz podkład mapowy</span>
                <button id="close-layers-card" class="p-1 rounded-full hover:bg-black/5">
                    <span class="material-symbols-outlined text-sm">close</span>
                </button>
            </div>
            <div class="space-y-1">
                <button onclick="switchLayer('ortho')" id="layer-btn-ortho" class="w-full text-left px-3 py-2 rounded-xl text-xs font-medium bg-md-primaryContainer text-md-onPrimaryContainer flex items-center space-x-2 transition">
                    <span class="material-symbols-outlined text-sm">satellite</span>
                    <span>Geoportal Ortofotomapa (Satelita)</span>
                </button>
                <button onclick="switchLayer('topo')" id="layer-btn-topo" class="w-full text-left px-3 py-2 rounded-xl text-xs font-medium hover:bg-black/5 flex items-center space-x-2 transition">
                    <span class="material-symbols-outlined text-sm">terrain</span>
                    <span>Geoportal Topograficzna</span>
                </button>
                <button onclick="switchLayer('osm')" id="layer-btn-osm" class="w-full text-left px-3 py-2 rounded-xl text-xs font-medium hover:bg-black/5 flex items-center space-x-2 transition">
                    <span class="material-symbols-outlined text-sm">map</span>
                    <span>OpenStreetMap (Awaryjna)</span>
                </button>
            </div>
        </div>

        <!-- Ruler Active Banner -->
        <div id="ruler-banner" class="absolute top-4 left-1/2 -translate-x-1/2 bg-md-onPrimaryContainer text-md-primaryContainer px-4 py-2 rounded-full shadow-lg z-20 hidden items-center space-x-3 text-sm font-medium">
            <span class="material-symbols-outlined text-base animate-pulse">straighten</span>
            <span id="ruler-distance-text">Dystans: 0 m</span>
            <button id="clear-ruler-btn" class="bg-white/20 hover:bg-white/30 px-2 py-0.5 rounded-full text-xs transition">Reset</button>
        </div>

        <!-- Android Floating Action Button (FAB) for adding marker -->
        <button id="fab-add" class="absolute bottom-6 right-6 z-20 bg-md-primaryContainer text-md-onPrimaryContainer hover:shadow-xl active:scale-95 transition-all p-4 rounded-2xl shadow-lg flex items-center justify-center">
            <span class="material-symbols-outlined text-2xl">add_location</span>
        </button>
    </main>

    <!-- Navigation Drawer / Sidebar (Markers List & Management) -->
    <div id="drawer-backdrop" class="fixed inset-0 bg-black/50 z-40 hidden transition-opacity opacity-0"></div>
    <aside id="drawer" class="fixed top-0 left-0 bottom-0 w-80 max-w-[85vw] bg-md-surface z-50 transform -translate-x-full transition-transform duration-300 ease-in-out shadow-2xl flex flex-col">
        <div class="p-6 bg-md-primaryContainer text-md-onPrimaryContainer flex flex-col justify-end min-h-[140px]">
            <div class="flex items-center justify-between mb-2">
                <span class="material-symbols-outlined text-3xl">map</span>
                <button id="close-drawer" class="p-1.5 rounded-full hover:bg-black/10 transition">
                    <span class="material-symbols-outlined">close</span>
                </button>
            </div>
            <h2 class="text-xl font-bold">Twoje Znaczniki</h2>
            <p id="marker-count-label" class="text-xs opacity-80 mt-1">Liczba zapisanych punktów: 0</p>
        </div>
        
        <div class="flex-1 overflow-y-auto p-4 space-y-3" id="markers-list-container">
            <div class="text-center py-12 text-md-outline text-sm" id="empty-markers-state">
                <span class="material-symbols-outlined text-4xl mb-2 opacity-50">pin_drop</span>
                <p>Brak zapisanych znaczników.<br>Kliknij ikonę + na mapie, aby dodać punkt.</p>
            </div>
        </div>

        <!-- APK Generator / PWA Export Banner -->
        <div class="p-4 border-t border-md-surfaceVariant bg-md-surfaceVariant/30">
            <button id="export-pwa-btn" class="w-full bg-md-primary text-md-onPrimary py-2.5 px-4 rounded-xl text-xs font-medium flex items-center justify-center space-x-2 shadow-sm hover:shadow transition">
                <span class="material-symbols-outlined text-base">download</span>
                <span>Pobierz paczkę PWA / APK Config</span>
            </button>
        </div>
    </aside>

    <!-- Modal: Add / Edit Marker Dialog -->
    <div id="marker-modal" class="fixed inset-0 bg-black/50 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-md-surface w-full max-w-md rounded-3xl p-6 shadow-2xl transform scale-95 transition-transform duration-200" id="marker-modal-content">
            <div class="flex items-center justify-between mb-4">
                <h3 id="modal-title" class="text-xl font-bold text-md-onSurface">Dodaj nowy znacznik</h3>
                <button id="close-modal-btn" class="p-2 rounded-full hover:bg-black/5 transition">
                    <span class="material-symbols-outlined">close</span>
                </button>
            </div>

            <form id="marker-form" class="space-y-4">
                <input type="hidden" id="modal-lat">
                <input type="hidden" id="modal-lng">
                
                <div>
                    <label class="block text-xs font-medium text-md-onSurfaceVariant mb-1">Tytuł miejsca *</label>
                    <input type="text" id="modal-name" required class="w-full bg-md-surfaceVariant px-4 py-3 rounded-xl border-none outline-none focus:ring-2 focus:ring-md-primary text-sm transition" placeholder="np. Działka ewidencyjna / Punkt pomiarowy">
                </div>

                <div>
                    <label class="block text-xs font-medium text-md-onSurfaceVariant mb-1">Opis / Notatka</label>
                    <textarea id="modal-desc" rows="3" class="w-full bg-md-surfaceVariant px-4 py-3 rounded-xl border-none outline-none focus:ring-2 focus:ring-md-primary text-sm transition resize-none" placeholder="Dodaj notatkę..."></textarea>
                </div>

                <div>
                    <label class="block text-xs font-medium text-md-onSurfaceVariant mb-1">Zdjęcie z aparatu / galerii</label>
                    <div class="flex space-x-2 mb-2">
                        <input type="file" id="modal-photo-file" accept="image/*" capture="environment" class="hidden">
                        <button type="button" id="upload-file-btn" class="flex-1 bg-md-surfaceVariant hover:bg-black/10 py-2.5 px-3 rounded-xl text-xs font-medium flex items-center justify-center space-x-1.5 transition">
                            <span class="material-symbols-outlined text-sm">photo_camera</span>
                            <span id="file-name-label">Zrób zdjęcie lub wybierz plik</span>
                        </button>
                    </div>
                </div>

                <div id="photo-preview-container" class="hidden relative h-36 rounded-xl overflow-hidden bg-black/5">
                    <img id="photo-preview" src="" alt="Podgląd" class="w-full h-full object-cover">
                    <button type="button" id="remove-photo-btn" class="absolute top-2 right-2 bg-black/60 text-white p-1 rounded-full hover:bg-black/80 transition">
                        <span class="material-symbols-outlined text-sm">close</span>
                    </button>
                </div>

                <div class="flex justify-end space-x-2 pt-2">
                    <button type="button" id="cancel-modal-btn" class="px-5 py-2.5 rounded-xl text-sm font-medium text-md-primary hover:bg-md-primary/10 transition">Anuluj</button>
                    <button type="submit" class="px-6 py-2.5 rounded-xl text-sm font-medium bg-md-primary text-md-onPrimary hover:shadow-md transition">Zapisz znacznik</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Notification Toast Message Box -->
    <div id="toast" class="fixed bottom-20 left-1/2 -translate-x-1/2 bg-md-onSurface text-md-surface px-4 py-2.5 rounded-full shadow-lg z-50 text-xs font-medium opacity-0 pointer-events-none transition-opacity duration-300 flex items-center space-x-2">
        <span class="material-symbols-outlined text-sm" id="toast-icon">info</span>
        <span id="toast-message">Komunikat</span>
    </div>

    <!-- JavaScript Application Logic -->
    <script>
        let map;
        let markers = [];
        let activePhotoData = null;
        let currentLayerType = 'ortho';
        let orthoLayer, topoLayer, osmLayer;

        // Ruler state
        let isRulerActive = false;
        let rulerPoints = [];
        let rulerPolyline = null;
        let rulerMarkers = [];

        // Add marker mode toggle
        let isAddMarkerMode = false;

        document.addEventListener('DOMContentLoaded', () => {
            initMap();
            initEventListeners();
            loadSavedMarkers();
        });

        function initMap() {
            // Poland center coordinates as default
            map = L.map('map', { zoomControl: false }).setView([52.0693, 19.4803], 6);

            // Add custom zoom control position
            L.control.zoom({ position: 'bottomright' }).addTo(map);

            // Define Geoportal WMTS Layers
            orthoLayer = L.tileLayer('https://mapy.geoportal.gov.pl/wss/service/PZGIK/Orto/WMTS/Standard?service=WMTS&request=GetTile&version=1.0.0&layer=Orto&style=default&format=image/jpeg&tileMatrixSet=Matrix&tileMatrix={z}&tileRow={y}&tileCol={x}', {
                minZoom: 0,
                maxZoom: 19,
                attribution: 'Geoportal.gov.pl / GUGiK',
                tileSize: 256
            });

            topoLayer = L.tileLayer('https://mapy.geoportal.gov.pl/wss/service/pub/guest/G2_GOV_MS_WMTS/MapServer/WMTS?service=WMTS&request=GetTile&version=1.0.0&layer=G2_GOV_MS_WMTS&style=default&format=image/png&tileMatrixSet=Matrix&tileMatrix={z}&tileRow={y}&tileCol={x}', {
                minZoom: 0,
                maxZoom: 19,
                attribution: 'Geoportal Topograficzna / GUGiK',
                tileSize: 256
            });

            osmLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: '&copy; OpenStreetMap contributors'
            });

            // Default layer
            orthoLayer.addTo(map);

            // Map click handler for adding markers or measuring distance
            map.on('click', (e) => {
                if (isRulerActive) {
                    addRulerPoint(e.latlng);
                } else if (isAddMarkerMode) {
                    openMarkerModal(e.latlng.lat, e.latlng.lng);
                    isAddMarkerMode = false;
                    showToast('Wprowadź dane znacznika');
                }
            });

            setTimeout(() => {
                map.invalidateSize();
            }, 250);
        }

        function switchLayer(type) {
            map.removeLayer(orthoLayer);
            map.removeLayer(topoLayer);
            map.removeLayer(osmLayer);

            // Reset UI buttons
            ['ortho', 'topo', 'osm'].forEach(t => {
                const btn = document.getElementById(`layer-btn-${t}`);
                if (btn) {
                    btn.className = "w-full text-left px-3 py-2 rounded-xl text-xs font-medium hover:bg-black/5 flex items-center space-x-2 transition";
                }
            });

            const activeBtn = document.getElementById(`layer-btn-${type}`);
            if (activeBtn) {
                activeBtn.className = "w-full text-left px-3 py-2 rounded-xl text-xs font-medium bg-md-primaryContainer text-md-onPrimaryContainer flex items-center space-x-2 transition";
            }

            if (type === 'ortho') {
                orthoLayer.addTo(map);
                showToast('Przełączono na Ortofotomapę Geoportalu');
            } else if (type === 'topo') {
                topoLayer.addTo(map);
                showToast('Przełączono na mapę topograficzną');
            } else if (type === 'osm') {
                osmLayer.addTo(map);
                showToast('Przełączono na OpenStreetMap');
            }

            currentLayerType = type;
            document.getElementById('layer-selector-card').classList.add('hidden');
        }

        function initEventListeners() {
            // Drawer toggles
            const drawer = document.getElementById('drawer');
            const backdrop = document.getElementById('drawer-backdrop');

            document.getElementById('menu-btn').addEventListener('click', () => {
                drawer.classList.remove('-translate-x-full');
                backdrop.classList.remove('hidden');
                setTimeout(() => backdrop.classList.remove('opacity-0'), 10);
            });

            const closeDrawerFn = () => {
                drawer.classList.add('-translate-x-full');
                backdrop.classList.add('opacity-0');
                setTimeout(() => backdrop.classList.add('hidden'), 300);
            };

            document.getElementById('close-drawer').addEventListener('click', closeDrawerFn);
            backdrop.addEventListener('click', closeDrawerFn);

            // Layer Selector Toggle
            const layerCard = document.getElementById('layer-selector-card');
            document.getElementById('toggle-layers-btn').addEventListener('click', () => {
                layerCard.classList.toggle('hidden');
            });
            document.getElementById('close-layers-card').addEventListener('click', () => {
                layerCard.classList.add('hidden');
            });

            // Locate button
            document.getElementById('locate-btn').addEventListener('click', () => {
                if (navigator.geolocation) {
                    showToast('Pobieranie lokalizacji...');
                    navigator.geolocation.getCurrentPosition(position => {
                        const lat = position.coords.latitude;
                        const lng = position.coords.longitude;
                        map.setView([lat, lng], 16);
                        showToast('Znaleziono Twoją lokalizację');
                    }, () => {
                        showToast('Nie udało się pobrać lokalizacji');
                    });
                } else {
                    showToast('Geolokalizacja niedostępna');
                }
            });

            // FAB Add Marker Mode
            document.getElementById('fab-add').addEventListener('click', () => {
                isAddMarkerMode = true;
                showToast('Kliknij na mapie miejsce na znacznik');
            });

            // Ruler Toggle
            document.getElementById('toggle-ruler-btn').addEventListener('click', () => {
                isRulerActive = !isRulerActive;
                const badge = document.getElementById('ruler-badge');
                const banner = document.getElementById('ruler-banner');

                if (isRulerActive) {
                    badge.classList.remove('hidden');
                    banner.classList.remove('hidden');
                    banner.classList.add('flex');
                    isAddMarkerMode = false;
                    showToast('Tryb linijki: klikaj punkty na mapie');
                } else {
                    clearRuler();
                }
            });

            document.getElementById('clear-ruler-btn').addEventListener('click', clearRuler);

            // Modal Form Handlers
            document.getElementById('close-modal-btn').addEventListener('click', closeModal);
            document.getElementById('cancel-modal-btn').addEventListener('click', closeModal);

            // File Upload for Photo
            const fileInput = document.getElementById('modal-photo-file');
            document.getElementById('upload-file-btn').addEventListener('click', () => fileInput.click());

            fileInput.addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (file) {
                    document.getElementById('file-name-label').textContent = file.name;
                    const reader = new FileReader();
                    reader.onload = (event) => {
                        activePhotoData = event.target.result;
                        const preview = document.getElementById('photo-preview');
                        preview.src = activePhotoData;
                        document.getElementById('photo-preview-container').classList.remove('hidden');
                    };
                    reader.readAsDataURL(file);
                }
            });

            document.getElementById('remove-photo-btn').addEventListener('click', () => {
                activePhotoData = null;
                fileInput.value = '';
                document.getElementById('file-name-label').textContent = 'Zrób zdjęcie lub wybierz plik';
                document.getElementById('photo-preview-container').classList.add('hidden');
            });

            // Marker Form Submit
            document.getElementById('marker-form').addEventListener('submit', (e) => {
                e.preventDefault();
                const lat = parseFloat(document.getElementById('modal-lat').value);
                const lng = parseFloat(document.getElementById('modal-lng').value);
                const name = document.getElementById('modal-name').value;
                const desc = document.getElementById('modal-desc').value;

                const markerData = {
                    id: Date.now().toString(),
                    lat, lng, name, desc,
                    photo: activePhotoData
                };

                saveMarker(markerData);
                closeModal();
                showToast('Znacznik został zapisany');
            });

            // PWA / APK Export Helper
            document.getElementById('export-pwa-btn').addEventListener('click', () => {
                alert("Instrukcja pakowania do APK:\n\n1. Ta aplikacja jest gotową aplikacją PWA (Progressive Web App).\n2. Możesz uruchomić ją w przeglądarce mobilnej i wybrać opcję 'Zainstaluj aplikację' lub 'Dodaj do ekranu głównego'.\n3. Do konwersji tego pliku HTML na natywny plik .APK dla systemu Android użyj darmowych narzędzi online takich jak PWABuilder (pwabuilder.com) lub darmowego generatora Capacitor / Cordova.");
            });
        }

        function openMarkerModal(lat, lng) {
            document.getElementById('modal-lat').value = lat;
            document.getElementById('modal-lng').value = lng;
            document.getElementById('modal-name').value = '';
            document.getElementById('modal-desc').value = '';
            activePhotoData = null;
            document.getElementById('file-name-label').textContent = 'Zrób zdjęcie lub wybierz plik';
            document.getElementById('photo-preview-container').classList.add('hidden');
            document.getElementById('marker-modal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('marker-modal').classList.add('hidden');
        }

        function saveMarker(data) {
            markers.push(data);
            localStorage.setItem('geoportal_markers', JSON.stringify(markers));
            renderMarkerOnMap(data);
            renderMarkersList();
        }

        function deleteMarker(id) {
            markers = markers.filter(m => m.id !== id);
            localStorage.setItem('geoportal_markers', JSON.stringify(markers));
            
            // Reload all markers on map
            map.eachLayer(layer => {
                if (layer instanceof L.Marker && layer.options.markerId) {
                    map.removeLayer(layer);
                }
            });
            markers.forEach(renderMarkerOnMap);
            renderMarkersList();
            showToast('Usunięto znacznik');
        }

        function renderMarkerOnMap(data) {
            const marker = L.marker([data.lat, data.lng], { markerId: data.id }).addTo(map);
            
            let popupContent = `<div class="p-2 max-w-xs font-sans">
                <h3 class="font-bold text-sm mb-1">${escapeHtml(data.name)}</h3>
                ${data.desc ? `<p class="text-xs text-gray-600 mb-2">${escapeHtml(data.desc)}</p>` : ''}
                ${data.photo ? `<div class="mb-2 rounded-lg overflow-hidden h-28"><img src="${data.photo}" class="w-full h-full object-cover"></div>` : ''}
                <div class="text-[10px] text-gray-400">Współrzędne: ${data.lat.toFixed(5)}, ${data.lng.toFixed(5)}</div>
            </div>`;

            marker.bindPopup(popupContent);
        }

        function loadSavedMarkers() {
            const saved = localStorage.getItem('geoportal_markers');
            if (saved) {
                try {
                    markers = JSON.parse(saved);
                    markers.forEach(renderMarkerOnMap);
                    renderMarkersList();
                } catch(e) {
                    console.error(e);
                }
            }
        }

        function renderMarkersList() {
            const container = document.getElementById('markers-list-container');
            const countLabel = document.getElementById('marker-count-label');
            countLabel.textContent = `Liczba zapisanych punktów: ${markers.length}`;

            if (markers.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-12 text-md-outline text-sm" id="empty-markers-state">
                        <span class="material-symbols-outlined text-4xl mb-2 opacity-50">pin_drop</span>
                        <p>Brak zapisanych znaczników.<br>Kliknij ikonę + na mapie, aby dodać punkt.</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = markers.map(m => `
                <div class="bg-md-surfaceVariant/50 p-3 rounded-2xl flex items-center justify-between shadow-sm">
                    <div class="flex-1 cursor-pointer pr-2" onclick="focusMarker(${m.lat}, ${m.lng})">
                        <h4 class="font-bold text-xs text-md-onSurface">${escapeHtml(m.name)}</h4>
                        <p class="text-[10px] text-md-onSurfaceVariant truncate">${m.desc ? escapeHtml(m.desc) : 'Brak opisu'}</p>
                    </div>
                    <div class="flex items-center space-x-1">
                        ${m.photo ? '<span class="material-symbols-outlined text-sm text-md-primary">image</span>' : ''}
                        <button onclick="deleteMarker('${m.id}')" class="p-1.5 rounded-full hover:bg-black/10 text-md-error transition">
                            <span class="material-symbols-outlined text-sm">delete</span>
                        </button>
                    </div>
                </div>
            `).join('');
        }

        function focusMarker(lat, lng) {
            map.setView([lat, lng], 17);
            document.getElementById('drawer').classList.add('-translate-x-full');
            document.getElementById('drawer-backdrop').classList.add('opacity-0');
            setTimeout(() => document.getElementById('drawer-backdrop').classList.add('hidden'), 300);
        }

        // Ruler Functions
        function addRulerPoint(latlng) {
            rulerPoints.push(latlng);
            const m = L.circleMarker(latlng, { radius: 5, color: '#6750A4', fillColor: '#EADDFF', fillOpacity: 1 }).addTo(map);
            rulerMarkers.push(m);

            if (rulerPoints.length > 1) {
                if (rulerPolyline) {
                    map.removeLayer(rulerPolyline);
                }
                rulerPolyline = L.polyline(rulerPoints, { color: '#6750A4', weight: 3, dashArray: '5, 5' }).addTo(map);
                
                let totalDist = 0;
                for (let i = 0; i < rulerPoints.length - 1; i++) {
                    totalDist += rulerPoints[i].distanceTo(rulerPoints[i+1]);
                }

                let distText = totalDist > 1000 ? (totalDist / 1000).toFixed(2) + ' km' : Math.round(totalDist) + ' m';
                document.getElementById('ruler-distance-text').textContent = `Dystans: ${distText}`;
            }
        }

        function clearRuler() {
            isRulerActive = false;
            rulerPoints = [];
            if (rulerPolyline) map.removeLayer(rulerPolyline);
            rulerMarkers.forEach(m => map.removeLayer(m));
            rulerMarkers = [];
            rulerPolyline = null;
            document.getElementById('ruler-badge').classList.add('hidden');
            document.getElementById('ruler-banner').classList.add('hidden');
            document.getElementById('ruler-banner').classList.remove('flex');
            showToast('Wyłączono linijkę');
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-message').textContent = msg;
            toast.classList.remove('opacity-0');
            setTimeout(() => {
                toast.classList.add('opacity-0');
            }, 2500);
        }

        function escapeHtml(text) {
            const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
            return text.replace(/[&<>"']/g, m => map[m]);
        }
    </script>
</body>
</html>
